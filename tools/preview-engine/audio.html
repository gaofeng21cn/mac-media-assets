<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MAC 配乐与拟音试听</title><style>body{background:#f4eedf;color:#323832;font:17px system-ui;max-width:960px;margin:40px auto;padding:20px}section{padding:15px 0;border-top:1px solid #d3c7ad}audio{display:block;width:100%;margin:10px 0}select,button{font:inherit;padding:8px}p{line-height:1.8}</style><h1>配乐与事件拟音</h1><p>按情绪与接触事件选择，比较分轨和变体。点击后才发声；试听和当前混音审查分别记录。</p><select id="role"><option value="bgm">配乐</option><option value="sfx">事件拟音</option></select><select id="asset"></select><main id="tracks"></main><script type="module">
const root=new URL('../../',location.href);const data=await(await fetch(new URL('collections/audio.json',root))).json();const role=document.querySelector('#role'),sel=document.querySelector('#asset'),container=document.querySelector('#tracks');function show(){const item=data.assets.find(x=>x.source_id===sel.value);container.replaceChildren();if(!item)return;const intro=document.createElement('p');intro.textContent=[item.title,item.bpm?'速度 '+item.bpm+' BPM':'',item.emotion_or_event.join(' / '),item.contact_sync].filter(Boolean).join(' · ');container.append(intro);for(const track of item.variants_or_tracks){const block=document.createElement('section'),label=document.createElement('div'),player=document.createElement('audio');label.textContent=track.path.split('/').at(-1)+' · '+track.duration_seconds.toFixed(2)+' 秒';player.controls=true;player.preload='none';player.src=new URL(track.path,root);block.append(label,player);container.append(block);}const note=document.createElement('p');note.textContent='当前登记：技术格式与时长已测量；完整听感和本集混音仍需实际审听。';container.append(note);}function choose(){sel.replaceChildren();for(const item of data.assets.filter(x=>x.category===role.value)){const op=document.createElement('option');op.value=item.source_id;op.textContent=item.title;sel.append(op);}show();}role.onchange=choose;sel.onchange=show;choose();window.__audioAssets=data.assets.length;
</script></html>
