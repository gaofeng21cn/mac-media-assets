    claim_id: MYO-CLM01
    claim: 2026版指南明确诊断应综合病史、屈光检查和眼部评估；视力检查是早期筛查，睫状肌麻痹验光是儿童诊断近视的重要检查。
    status: supported
    evidence_type: guideline_or_official_material
    source_refs:
