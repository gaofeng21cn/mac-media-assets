- question_id: MAS-RQ02
  question: 脂肪肝为什么与代谢有关
  priority: material_for_core_patient_task
  claims:
  - question_id: MAS-RQ02
    claim_id: MAS-MAT02
    claim: 指南把营养过剩、胰岛素抵抗和脂肪组织功能异常放在机制中心：脂肪的合成、利用和转运失衡导致肝内沉积，部分患者还发生炎症及纤维化。可把“脂肪进出失衡”和“损伤后的组织变化”分开解释，避免画成脂肪把肝脏机械堵住。
    status: supported
    evidence_type: guideline_or_official_education_synthesis
    source_refs:
    - source_id: MAS-001
      locator: 第二节（二）发病机制
      relationship: direct_or_limited_support
