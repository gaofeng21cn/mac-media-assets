    evidence_type: guideline_or_official_material
    source_refs:
    - source_id: AR-001
      locator: 第2页定义；第3页临床表现
      relationship: direct_or_limited_support
    original_conclusion_paraphrase: 中国指南将变应性鼻炎描述为IgE介导的鼻黏膜非感染性慢性炎性疾病，典型症状为阵发性喷嚏、清水样涕、鼻痒和鼻塞。
    population: 反复鼻痒、喷嚏、鼻塞、流涕的成人和儿童家庭
    jurisdiction: 中国大陆
    evidence_setting:
