  claims:
  - question_id: ALL-Q01
    claim_id: ALL-CLM01
    claim: 中国指南将变应性鼻炎描述为IgE介导的鼻黏膜非感染性慢性炎性疾病，典型症状为阵发性喷嚏、清水样涕、鼻痒和鼻塞。
