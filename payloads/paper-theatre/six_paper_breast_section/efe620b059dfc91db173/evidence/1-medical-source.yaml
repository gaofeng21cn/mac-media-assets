- fact_id: B01
  claim: 结节/肿块描述不等于恶性诊断，大小之外需综合影像临床。
  source_refs:
  - breast_nodules
  - ACRbreast
  - ACR2013
  scope: 成年患者及家属；青少年仅明确区分诊断边界，不提供具体用药剂量
  medical_review: pending_clinician_review
  visual_boundary: 画面不得增加必然恶化、诊断保证、用药操作或虚构患者数值。
- fact_id: B02
  claim: BI-RADS是影像评估和管理建议，不是必然进程；0补评估、3常短期随访、4/5需按建议取样评估。
