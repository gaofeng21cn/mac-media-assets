schema: medical_fact_library/v1
clinical_review: pending
facts:
- fact_id: HT-01
  claim: 一次读数通常不足确诊；中国常用诊室标准为未用药、非同日3次规范测量收缩压≥140或舒张压≥90 mmHg；显著升高或急症不能等待凑次数。已治疗者不因读数正常而否认病史。
  source_ids:
  - S02
  - S03
  locator: S02诊断章节；S03定义
  boundary: 不混用WHO两日诊断表述；不要求停药重新确诊
- fact_id: HT-02
  claim: 经验证上臂式设备、合适袖带，测前30分钟避开运动吸烟咖啡浓茶，排尿后静坐至少5分钟；背足臂支撑，袖带心脏同高；不讲话活动；首次双臂评估。
  source_ids:
  - S01
  - S02
  locator: S01第5节；S02血压测量
  boundary: 设备细节使用审定图示，不让生成模型猜袖带位置
- fact_id: HT-03
  claim: 家庭血压看规范多日平均，界值收缩压≥135或舒张压≥85；常用初诊/调药记录5–7天早晚，每次2–3遍间隔约1分钟；早起排尿后早餐服药前，晚睡前，记录所有值。
  source_ids:
  - S01
  - S02
  locator: S01第5节；S02家庭测量
  boundary: 不挑数值；特定医嘱优先，不为测量拖延药物
- fact_id: HT-04
  claim: 诊室与家庭差异可见于白大衣或隐蔽性高血压；核对方法，必要时动态监测日夜血压，由医生综合判断。
  source_ids:
  - S02
  locator: S02诊室外血压、特殊定义
  boundary: 图示数据只作示例，不画成真实患者诊断
- fact_id: HT-05
  claim: 高血压可无症状，长期增加心脑肾损害风险；控制血压有助降低未来风险，风险不代表并发症已经存在。
  source_ids:
  - S04
  - S01
  locator: S04 Symptoms/Complications；S01第9节
  boundary: 不以恐吓、爆裂或必然器官损伤表达
- fact_id: HT-06
  claim: 成人食盐逐步少于5g/日，计入调味料与加工食品；比较同单位钠及摄入量；含钾低钠盐需顾及肾功能、高钾及药物，不自行补钾。
  source_ids:
  - S03
  - S02
  locator: S03减钠增钾及调味料表；S02饮食/药物
  boundary: 5g是食盐，不是钠；不概括所有降压药都禁低钠盐
- fact_id: HT-07
  claim: 治疗一般需长期规律；达标不自行停药；按个体情况联合药物，不借药或自行加倍；漏服处理取决于药物与时间，咨询医生药师。
  source_ids:
  - S01
  - S02
  - S04
  locator: S01第8节；S02药物治疗；S04Treatment
  boundary: 不提供个体处方或一律补服规则
- fact_id: HT-08
  claim: 身体稳定时循序运动，一般成人逐步达到每周150分钟中等强度有氧；明显失控、不稳定或症状先评估；力量练习避免憋气，重视体重和睡眠。
  source_ids:
  - S02
  - S04
  locator: S02运动与睡眠呼吸暂停；S04Prevention
  boundary: 一般目标不是每个人的处方；不要求急症先完成运动
- fact_id: HT-09
  claim: 带全血压、症状、药物，先核对操作依从性及影响因素，必要时查肾功能血钾及继发原因；达标至少每3月、未达标至少每月随访，异常可更早。
  source_ids:
  - S01
  - S02
  locator: S01第7–8节；S02继发性高血压
  boundary: 基层随访标准为最低频率，不覆盖急症或个体要求
- fact_id: HT-10
  claim: 胸痛气短、局灶神经异常、意识改变等立即急救，不等待阈值或多天记录；无危险症状但复测仍≥180收缩压或≥110舒张压，尽快医疗评估，不自行快速降压。
  source_ids:
  - S01
  - S02
  - S04
  locator: S01第8.4节；S02第60–63页紧急处理；S04Symptoms
  boundary: 180/110用于提示尽快评估，不等于仅凭数值诊断高血压急症；中国120
- fact_id: HT-11
  claim: 诊断界值不同于治疗目标；目标结合年龄风险合并病和耐受，站立头晕等需评估；家庭与诊室目标分别问清，不自行快速降压。
  source_ids:
  - S01
  - S02
  - S04
  locator: S01第8.1节；S02治疗目标/老年；S04Treatment
  boundary: 本集不列统一目标表，避免照搬旧指南或一刀切
